<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Itransform Technology — Admin Console</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1417;--ink:#eef2f1;--mute:#9fb0b5;--ac:#3aa596;--rust:#d2603a;--amber:#e9a23b;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){width:44vmax;height:44vmax;background:var(--ac);top:-14vmax;right:-10vmax}
.bg i:nth-child(2){width:34vmax;height:34vmax;background:#2a5b8a;bottom:-14vmax;left:-8vmax;animation-duration:30s}
@keyframes drift{to{transform:translate(-7vmax,6vmax) scale(1.15)}}
h2,h3,.brand{font-family:Fraunces,Georgia,serif;font-weight:700}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.hide{display:none!important}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{width:min(400px,100%);padding:34px;animation:up .8s both}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:6px}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);font:inherit;outline:none;transition:.2s}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(58,165,150,.25)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--ac);color:#04201b;transition:.2s}
button:hover{transform:translateY(-1px);filter:brightness(1.1)}button:disabled{opacity:.6;cursor:wait}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:13px}button.del{background:transparent;color:var(--rust);border:1px solid var(--rust)}
.full{width:100%;margin-top:22px}.err{color:#ffb199;font-size:13px;min-height:18px;margin-top:12px}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;margin:14px;flex-wrap:wrap}
.brand{font-size:22px;margin-right:auto}.brand b{color:var(--ac)}.brand small{font:500 12px Figtree;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-left:8px}
nav{display:flex;gap:4px}nav button{background:transparent;color:var(--mute);padding:8px 14px}nav button.on{background:rgba(255,255,255,.12);color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:6px 14px 50px}section{animation:up .5s both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{padding:16px 20px}.stat b{font:700 30px Fraunces,serif;display:block}.stat span{color:var(--mute);font-size:13px}
.panel{padding:22px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:8px 10px}td{padding:11px 10px;border-top:1px solid var(--line)}
.chip{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:rgba(58,165,150,.25);color:#7fe0d0}.exp{background:rgba(210,96,58,.28);color:#ffb199}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 20px;z-index:9}
@media(max-width:700px){.stat{padding:12px}.stat b{font-size:24px}.stats{gap:8px}}
</style></head><body>
<div class="bg"><i></i><i></i></div>

<div id="login" class="hide">
  <form class="glass" id="lf"><div class="tag">Restricted area</div><h2 style="font-size:26px">Admin console</h2>
    <label>Admin username</label><input id="lu" autocomplete="username" required>
    <label>Password</label><input id="lp" type="password" autocomplete="current-password" required>
    <div class="err" id="le"></div><button class="full" id="lb">Enter console</button></form>
</div>

<div id="app" class="hide">
  <header class="glass"><div class="brand">Itransform <b>Technology</b><small>Admin</small></div>
    <nav><button data-t="u" class="on">Users</button><button data-t="a">My password</button></nav>
    <span style="color:var(--mute)" id="who"></span><button class="ghost sm" id="lo">Log out</button></header>
  <main>
    <section id="s-u">
      <div class="stats"><div class="glass stat"><b id="n1">0</b><span>Users</span></div><div class="glass stat"><b id="n2">0</b><span>Active</span></div><div class="glass stat"><b id="n3">0</b><span>Deactivated</span></div></div>
      <form class="glass panel" id="uf"><h3>Add user</h3><div class="grid"><div><label>Username</label><input id="un" required></div><div><label>Password</label><input id="up" minlength="6" required></div></div><div class="err" id="ue"></div><button style="margin-top:6px">Create user</button></form>
      <div class="glass panel wrap" id="ut"></div>
    </section>
    <section id="s-a" class="hide"><form class="glass panel" id="cf" style="max-width:440px"><h3>Change admin password</h3>
      <label>Current password</label><input id="c0" type="password" required><label>New password</label><input id="c1" type="password" minlength="6" required><label>Confirm new password</label><input id="c2" type="password" required>
      <div class="err" id="ce"></div><button>Update password</button></form></section>
  </main>
</div>
<div id="toast" class="glass hide"></div>

<script>
const API='https://script.google.com/macros/s/AKfycby-_HtWqjdkyMWe4uy3ZHfjvjWdqFY8Fr5ogANLQxSZlvahDBrX2xfPYTzc6B0pAgNj_Q/exec';   // same Apps Script /exec URL as index.html
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=JSON.parse(localStorage.getItem('bbadmin')||'null');
async function api(action,d={}){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token:S&&S.token,...d})}), j=await r.json();
  if(j.err==='auth'){signout(true);throw 'Session expired, please sign in again'} if(j.err)throw j.err; return j;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.add('hide'),2800)}
function view(){$('#login').classList.toggle('hide',!!S);$('#app').classList.toggle('hide',!S);if(S){$('#who').textContent=S.user;users()}}
function signout(quiet){if(S&&!quiet)api('logout').catch(()=>{});S=null;localStorage.removeItem('bbadmin');view()}
$('#lo').onclick=()=>signout();
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';$('#lb').disabled=true;
  try{S=await api('login',{u:$('#lu').value,p:$('#lp').value,admin:true});localStorage.setItem('bbadmin',JSON.stringify(S));$('#lp').value='';view()}
  catch(x){$('#le').textContent=x}$('#lb').disabled=false};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['u','a'].forEach(k=>$('#s-'+k).classList.toggle('hide',k!==b.dataset.t))});
async function users(){try{const L=(await api('users')).users;
  $('#n1').textContent=L.length;$('#n2').textContent=L.filter(u=>u.active).length;$('#n3').textContent=L.filter(u=>!u.active).length;
  $('#ut').innerHTML=`<table><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr>${L.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.role}</td><td><span class="chip ${u.active?'ok':'exp'}">${u.active?'Active':'Deactivated'}</span></td><td style="white-space:nowrap">${u.role==='superadmin'?'':`<button class="ghost sm" onclick="tg('${esc(u.name)}')">${u.active?'Deactivate':'Activate'}</button> <button class="ghost sm" onclick="rp('${esc(u.name)}')">Reset password</button> <button class="del sm" onclick="du('${esc(u.name)}')">Delete</button>`}</td></tr>`).join('')}</table>`}catch(x){toast(x)}}
const act=async(a,d,m)=>{try{await api(a,d);toast(m);users()}catch(x){toast(x)}};
const tg=n=>act('toggleUser',{name:n},'Status updated'),du=n=>confirm('Delete user '+n+'? Their purchase records stay in the sheet.')&&act('delUser',{name:n},'User deleted'),rp=n=>{const p=prompt('New password for '+n+' (min 6 chars):');p&&act('resetPw',{name:n,pw:p},'Password reset')};
$('#uf').onsubmit=async e=>{e.preventDefault();$('#ue').textContent='';try{await api('addUser',{name:$('#un').value,pw:$('#up').value});e.target.reset();toast('User created');users()}catch(x){$('#ue').textContent=x}};
$('#cf').onsubmit=async e=>{e.preventDefault();$('#ce').textContent='';
  if($('#c1').value!==$('#c2').value){$('#ce').textContent='Passwords do not match';return}
  try{await api('changePw',{old:$('#c0').value,pw:$('#c1').value});e.target.reset();toast('Password updated')}catch(x){$('#ce').textContent=x}};
view();
</script></body></html>
