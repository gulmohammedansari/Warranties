<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billbook — Purchases & Warranties</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1b18;--ink:#f3efe6;--mute:#a9b8b2;--amber:#e9a23b;--teal:#3aa596;--rust:#d2603a;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;background:var(--amber);top:-14vmax;left:-10vmax;opacity:.4}
.bg i:nth-child(2){width:40vmax;height:40vmax;background:var(--teal);bottom:-16vmax;right:-8vmax;animation-duration:28s}
.bg i:nth-child(3){width:24vmax;height:24vmax;background:var(--rust);top:45%;left:48%;animation-duration:18s;opacity:.35}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.18) rotate(20deg)}}
.bg:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
h1,h2,h3,.brand{font-family:Fraunces,Georgia,serif;font-weight:700}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:40px;padding:6vw;max-width:1200px;margin:auto}
.hero h1{font-size:clamp(34px,5vw,60px);line-height:1.05;letter-spacing:-.02em;animation:up .9s both}
.hero h1 em{color:var(--amber);font-style:italic}
.hero p{color:var(--mute);margin-top:18px;max-width:380px;animation:up .9s .15s both}
#login form{padding:34px;animation:up .9s .3s both;transform:rotate(.6deg)}
#login h2{font-size:24px;margin-bottom:4px}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
input,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(233,162,59,.2)}
select option{color:#111}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--amber);color:#1b1305;transition:.2s}
button:hover{transform:translateY(-1px);filter:brightness(1.08)}
button:disabled{opacity:.6;cursor:wait}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:13px}button.del{background:transparent;color:var(--rust);border:1px solid var(--rust)}
.full{width:100%;margin-top:22px}
.err{color:#ffb199;font-size:13px;min-height:18px;margin-top:12px}
/* app */
header{display:flex;align-items:center;gap:16px;padding:14px 22px;margin:14px;flex-wrap:wrap}
.brand{font-size:22px;margin-right:auto}.brand b{color:var(--amber)}
nav{display:flex;gap:4px}
nav button{background:transparent;color:var(--mute);padding:8px 14px}
nav button.on{background:rgba(255,255,255,.12);color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:6px 14px 50px}
section{animation:up .5s both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{padding:16px 20px}.stat b{font:700 30px Fraunces,serif;display:block}.stat span{color:var(--mute);font-size:13px}
.panel{padding:22px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 14px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:8px 10px}
td{padding:11px 10px;border-top:1px solid var(--line)}
.chip{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:rgba(58,165,150,.25);color:#7fe0d0}.soon{background:rgba(233,162,59,.25);color:#ffd08a}.exp{background:rgba(210,96,58,.28);color:#ffb199}
dialog{border:0;background:transparent;max-width:92vw}dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
dialog img{max-width:88vw;max-height:80vh;border-radius:14px;display:block}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 20px;z-index:9;transition:.3s}
.empty{padding:30px;text-align:center;color:var(--mute)}
@media(max-width:760px){#login{grid-template-columns:1fr;padding:30px 18px}#login form{transform:none}.stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{padding:12px}.stat b{font-size:24px}}
</style></head><body>
<div class="bg"><i></i><i></i><i></i></div>

<div id="login" class="hide">
  <div class="hero"><h1>Every bill.<br>Every warranty.<br><em>Kept safe.</em></h1><p>Know what you bought, what you paid, and exactly when the cover runs out — before the shop says "sorry, expired".</p></div>
  <form class="glass" id="lf">
    <h2>Sign in</h2><div style="color:var(--mute);font-size:14px">Use the username your admin gave you.</div>
    <label>Username</label><input id="lu" autocomplete="username" required>
    <label>Password</label><input id="lp" type="password" autocomplete="current-password" required>
    <div class="err" id="le"></div>
    <button class="full" id="lb">Sign in</button>
  </form>
</div>

<div id="app" class="hide">
  <header class="glass"><div class="brand">Bill<b>book</b></div>
    <nav><button data-t="p" class="on">Purchases</button><button data-t="u" id="tu" class="hide">Users</button><button data-t="a">Account</button></nav>
    <span style="color:var(--mute)" id="who"></span><button class="ghost sm" id="lo">Log out</button></header>
  <main>
    <section id="s-p">
      <div class="stats"><div class="glass stat"><b id="n1">0</b><span>Items</span></div><div class="glass stat"><b id="n2">0</b><span>Expiring in 60 days</span></div><div class="glass stat"><b id="n3">0</b><span>Expired</span></div></div>
      <form class="glass panel" id="pf"><h3 style="margin-bottom:6px">Add a purchase</h3>
        <div class="grid">
          <div><label>Product</label><input id="pn" required></div>
          <div><label>Qty</label><input id="pq" type="number" min="1" value="1" required></div>
          <div><label>Date of purchase</label><input id="pd" type="date" required></div>
          <div><label>Warranty</label><div style="display:flex;gap:6px"><input id="pw" type="number" min="0" value="12" required><select id="pu" style="width:110px"><option value="1">Months</option><option value="12">Years</option></select></div></div>
          <div><label>Paid via</label><select id="pp"><option>Cash</option><option>UPI</option><option>Net Banking</option></select></div>
          <div><label>Invoice image</label><input id="pi" type="file" accept="image/*"></div>
        </div><div class="err" id="pe"></div><button id="pb" style="margin-top:6px">Save purchase</button></form>
      <div class="glass panel wrap"><input id="q" placeholder="Search products…" style="max-width:260px;margin-bottom:10px"><div id="tb"></div></div>
    </section>
    <section id="s-u" class="hide">
      <form class="glass panel" id="uf"><h3>Add user</h3><div class="grid"><div><label>Username</label><input id="un" required></div><div><label>Password</label><input id="up" type="text" required minlength="6"></div></div><button style="margin-top:16px">Create user</button></form>
      <div class="glass panel wrap" id="ut"></div>
    </section>
    <section id="s-a" class="hide"><form class="glass panel" id="cf" style="max-width:440px"><h3>Change password</h3>
      <label>Current password</label><input id="c0" type="password" required><label>New password</label><input id="c1" type="password" minlength="6" required><label>Confirm new password</label><input id="c2" type="password" required>
      <div class="err" id="ce"></div><button>Update password</button></form></section>
  </main>
</div>
<dialog id="dg"><img id="im" alt="Invoice"><br><button class="ghost" style="margin-top:10px" onclick="dg.close()">Close</button></dialog>
<div id="toast" class="glass hide"></div>

<script>
const API='PASTE_YOUR_WEB_APP_URL_HERE';   // Apps Script "Web app" URL (ends with /exec)
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=JSON.parse(localStorage.getItem('bb')||'null'), items=[];
async function api(action,d={}){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token:S&&S.token,...d})}), j=await r.json();
  if(j.err==='auth'){signout(true);throw 'Session expired, please sign in again'} if(j.err)throw j.err; return j;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.add('hide'),2800)}
const busy=(b,on)=>b.disabled=on;
function view(){$('#login').classList.toggle('hide',!!S);$('#app').classList.toggle('hide',!S);
  if(S){$('#who').textContent=S.user;$('#tu').classList.toggle('hide',S.role!=='superadmin');load()}}
function signout(quiet){if(S&&!quiet)api('logout').catch(()=>{});S=null;localStorage.removeItem('bb');view()}
$('#lo').onclick=()=>signout();
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';busy($('#lb'),1);
  try{S=await api('login',{u:$('#lu').value,p:$('#lp').value});localStorage.setItem('bb',JSON.stringify(S));$('#lp').value='';view()}
  catch(x){$('#le').textContent=x}busy($('#lb'),0)};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['p','u','a'].forEach(k=>$('#s-'+k).classList.toggle('hide',k!==b.dataset.t));if(b.dataset.t==='u')users()});
/* purchases */
$('#pd').valueAsDate=new Date();
const days=d=>Math.ceil((new Date(d+'T23:59:59')-new Date())/864e5);
function draw(){const f=$('#q').value.toLowerCase(),L=items.filter(i=>i.product.toLowerCase().includes(f)).sort((a,b)=>a.expiry<b.expiry?-1:1);
  $('#n1').textContent=items.length;$('#n2').textContent=items.filter(i=>days(i.expiry)>=0&&days(i.expiry)<=60).length;$('#n3').textContent=items.filter(i=>days(i.expiry)<0).length;
  $('#tb').innerHTML=L.length?`<table><tr><th>Product</th><th>Qty</th><th>Bought</th><th>Warranty till</th><th>Status</th><th>Paid</th><th></th></tr>${L.map(i=>{const d=days(i.expiry),c=d<0?'exp':d<=60?'soon':'ok';
  return`<tr><td>${esc(i.product)}</td><td>${i.qty}</td><td>${i.date}</td><td>${i.expiry}<div style="color:var(--mute);font-size:12px">${i.months} mo</div></td><td><span class="chip ${c}">${d<0?'Expired':d+' days left'}</span></td><td>${esc(i.payment)}</td>
  <td style="white-space:nowrap">${i.hasFile?`<button class="ghost sm" onclick="inv('${i.id}')">Invoice</button> `:''}<button class="del sm" onclick="rm('${i.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">Nothing here yet — add your first purchase above.</div>'}
async function load(){try{items=(await api('list')).items;draw()}catch(x){toast(x)}}
$('#q').oninput=draw;
const shrink=f=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8).split(',')[1])};im.onerror=()=>rej('Could not read image');im.src=URL.createObjectURL(f)});
$('#pf').onsubmit=async e=>{e.preventDefault();$('#pe').textContent='';busy($('#pb'),1);
  try{const f=$('#pi').files[0],d={product:$('#pn').value,qty:$('#pq').value,date:$('#pd').value,months:$('#pw').value*$('#pu').value,payment:$('#pp').value};
    if(f){$('#pb').textContent='Uploading…';d.file=await shrink(f);d.mime='image/jpeg'}
    await api('add',d);e.target.reset();$('#pd').valueAsDate=new Date();toast('Purchase saved');load()}
  catch(x){$('#pe').textContent=x}$('#pb').textContent='Save purchase';busy($('#pb'),0)};
async function rm(id){if(!confirm('Delete this purchase and its invoice?'))return;try{await api('del',{id});toast('Deleted');load()}catch(x){toast(x)}}
async function inv(id){try{toast('Loading invoice…');const r=await api('invoice',{id});$('#im').src=`data:${r.mime};base64,${r.data}`;dg.showModal()}catch(x){toast(x)}}
/* users */
async function users(){try{const L=(await api('users')).users;$('#ut').innerHTML=`<table><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr>${L.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.role}</td><td><span class="chip ${u.active?'ok':'exp'}">${u.active?'Active':'Deactivated'}</span></td><td style="white-space:nowrap">${u.role==='superadmin'?'':`<button class="ghost sm" onclick="tg('${esc(u.name)}')">${u.active?'Deactivate':'Activate'}</button> <button class="ghost sm" onclick="rp('${esc(u.name)}')">Reset password</button> <button class="del sm" onclick="du('${esc(u.name)}')">Delete</button>`}</td></tr>`).join('')}</table>`}catch(x){toast(x)}}
const act=async(a,d,m)=>{try{await api(a,d);toast(m);users()}catch(x){toast(x)}};
const tg=n=>act('toggleUser',{name:n},'Status updated'),du=n=>confirm('Delete user '+n+'?')&&act('delUser',{name:n},'User deleted'),rp=n=>{const p=prompt('New password for '+n+' (min 6 chars):');p&&act('resetPw',{name:n,pw:p},'Password reset')};
$('#uf').onsubmit=async e=>{e.preventDefault();try{await api('addUser',{name:$('#un').value,pw:$('#up').value});e.target.reset();toast('User created');users()}catch(x){toast(x)}};
$('#cf').onsubmit=async e=>{e.preventDefault();const ce=$('#ce');ce.textContent='';
  if($('#c1').value!==$('#c2').value){ce.textContent='Passwords do not match';return}
  try{await api('changePw',{old:$('#c0').value,pw:$('#c1').value});e.target.reset();toast('Password updated')}catch(x){ce.textContent=x}};
view();
</script></body></html>
